apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-api
  labels:
    app.kubernetes.io/name: application-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: application-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/your-app-api:replace-with-version
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: application-api-secrets
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: application-api
spec:
  selector:
    app.kubernetes.io/name: application-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
